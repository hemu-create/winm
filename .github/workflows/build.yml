name: build

on:
  push:
  pull_request:

jobs:
  b00t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none-softfloat
      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y lld llvm
      - name: Build b00t
        run: |
          cd b00t
          cargo build --release
          llvm-objcopy -O binary target/aarch64-unknown-none-softfloat/release/b00t target/b00t.img
          python3 ../tools/pad_b00t.py target/b00t.img
      - name: Check b00t
        run: |
          cd b00t
          cargo fmt --check
          cargo clippy --release -- -D warnings
      - name: Check Python
        run: python3 -m compileall installer tools
      - name: Check 16 KiB DMA helpers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror tests/winm_dma_test.c drivers/common/winm_dma.c drivers/nvme/nvme.c -o /tmp/winm_dma_test
          /tmp/winm_dma_test
          gcc -std=c11 -Wall -Wextra -Werror tests/nvme_core_test.c drivers/nvme/nvme_core.c -o /tmp/nvme_core_test
          /tmp/nvme_core_test
      - name: Upload b00t image
        uses: actions/upload-artifact@v4
        with:
          name: b00t.img
          path: b00t/target/b00t.img

  driver-skeletons:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile C skeletons
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path drivers -Recurse -Filter *.c |
            Where-Object { $_.FullName -notmatch '\\drivers\\nvme\\windows\\' }
          foreach ($file in $files) {
            cl /nologo /W4 /c $file.FullName /Fo"$env:TEMP\$($file.BaseName).obj"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  wdk-driver:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: Restore WDK NuGet packages
        shell: pwsh
        run: nuget restore packages.config -PackagesDirectory packages
      - name: Build WinM NVMe KMDF driver
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (!$msbuild) { throw "MSBuild not found" }
          $wdkBin = "D:/a/winm/winm/packages/Microsoft.Windows.WDK.arm64.10.0.28000.2526/c/bin/10.0.28000.0"
          $infToolPath = $wdkBin + "/x64/"
          & $msbuild drivers/nvme/windows/winm_nvme.vcxproj `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:InfToolPath=$infToolPath `
            /p:InfToolArchitecture=Native64Bit `
            /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload WinM NVMe driver
        uses: actions/upload-artifact@v4
        with:
          name: winm-nvme-driver
          path: |
            drivers/nvme/windows/bin/ARM64/Release/**/*.sys
            drivers/nvme/windows/bin/ARM64/Release/**/*.inf
            drivers/nvme/windows/bin/ARM64/Release/**/*.cat
